# Builds an installable Android APK (free) with Capacitor + Gradle.
# Run it from: Actions → "Build Android APK" → Run workflow. Download the APK from the run's Artifacts.
# Pushing a tag like v1.0.0 also attaches the APK to a GitHub Release.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # The GitHub runner already ships the Android SDK; just make sure licences are accepted.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/android-patch.mjs
          # Launcher icon + splash from resources/icon.png and resources/splash.png (best effort)
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b0b10' --splashBackgroundColor '#0b0b10' || echo "icon generation skipped"
          npx cap sync android
      - name: Build debug APK (installable; signed with the standard debug key)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nova.apk
      - uses: actions/upload-artifact@v4
        with: { name: Nova-APK, path: Nova.apk }
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: Nova.apk, generate_release_notes: true }
